<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BurgerMatch — Encontre sua hamburgueria ideal." />
    <meta name="theme-color" content="#FFF4E0" />
    <meta name="apple-mobile-web-app-title" content="BurgerMatch" />
    <!-- Fontes: hospedadas no próprio app (src/main.tsx), para funcionar offline. -->

    <title>BurgerMatch</title>
  </head>
  <body>
    <!--
      Enquanto o JavaScript carrega, aparece o ícone animado (o SVG traz a própria
      animação em CSS). O React substitui este conteúdo assim que o app abre.
    -->
    <div id="root">
      <div
        role="status"
        style="min-height: 100dvh; display: grid; place-items: center; background: #fff4e0"
      >
        <img
          src="/src/assets/logos/burgermatch-icone-animado.svg"
          alt=""
          width="112"
          height="112"
        />
        <span
          style="
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
          "
          >Carregando o BurgerMatch…</span
        >
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
